# Security headers of the dashboard (design §9). Included in every location that sets headers of its own, because
# nginx drops the headers of an outer block as soon as an inner block adds one.
#
# CSP: scripts and styles only from this origin (the build has no inline script and no inline style attribute),
# images from this origin and GitHub's avatar host, calls only back to this origin, nothing may frame the page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
