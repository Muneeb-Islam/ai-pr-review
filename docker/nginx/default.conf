# The dashboard's web server: static files, and a reverse proxy to the api so the browser sees one origin (the
# session cookie, CSRF and CORS rules all assume that). TLS is terminated in front of this (docs/operations.md).
server_tokens off;

# Real client addresses for the api's rate limits. X-Forwarded-For is trusted only from private ranges (the Docker
# network and a typical load balancer); widen or narrow these to your proxy's addresses.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Docker's embedded DNS: the api is looked up when a request arrives, not at start-up, so this container starts
# even while the api is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Webhook bodies are capped by the api (WEBHOOK_MAX_BODY_BYTES, 5 MiB by default).
  client_max_body_size 6m;
  include /etc/nginx/security-headers.conf;

  # Liveness of this container only.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Operator metrics are not for the internet: scrape the api directly, inside the network.
  location = /metrics {
    return 404;
  }

  # The api. One variable so the name is resolved per request (see `resolver`).
  location ~ ^/(api|auth|webhooks)/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # After real_ip, $remote_addr is the real client: send exactly that, never what the client claimed.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # The live run stream is long-lived and must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
    # The api sets its own security headers (a stricter CSP, no-store). Any add_header in a location stops it from
    # inheriting the server-level ones, so nothing is sent twice.
    add_header Cache-Control "no-store" always;
  }
  location ~ ^/(healthz|readyz)$ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
  }

  # Built files carry a content hash in their name: cache them for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  # The single-page app: any other path is a route of the app.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
}
