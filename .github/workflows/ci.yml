name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly: new advisories appear without a change of ours, and the chaos checks are slow.
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Third-party actions are pinned to a commit (a tag can be moved). Update a pin by looking the tag up and reviewing the diff.
jobs:
  check:
    runs-on: ubuntu-latest
    # Real PostgreSQL and Redis for the database, queue and worker tests (same major versions as docker-compose.yml).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aipr
          POSTGRES_PASSWORD: aipr
          POSTGRES_DB: aipr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aipr -d aipr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aipr:aipr@localhost:5432/aipr
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The real migrate and seed scripts, from an empty database to latest.
      - run: npm run db:migrate
      - run: npm run db:seed
      # Includes the security suites: authorisation matrix and route inventory, row-level security, planted canaries,
      # prompt-injection fixtures, CSRF, session fixation, rate limits, key rotation (Phase 15).
      - run: npm test
      - run: npm run build
      # The bundles must start: a missing `require` or a bad import shows up here, not in production.
      - run: |
          for app in api worker; do
            out="$(node apps/$app/dist/index.js 2>&1 || true)"
            echo "$out" | grep -q "Missing required environment variables" || { echo "apps/$app/dist/index.js did not start cleanly:"; echo "$out"; exit 1; }
          done

  # No known high or critical vulnerability in any dependency (production or development), on every change and weekly.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm audit --audit-level=high

  # The production images build, and the stack they make comes up healthy and serves the dashboard (docker-compose.prod.yml).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ops/smoke.sh

  # Browser test of the dashboard under the production Content-Security-Policy.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aipr
          POSTGRES_PASSWORD: aipr
          POSTGRES_DB: aipr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aipr -d aipr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://aipr:aipr@localhost:5432/aipr
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @ai-pr-review/web
      - run: npm run e2e -w @ai-pr-review/web

  # Real worker processes against real PostgreSQL and Redis containers that the suite stops, kills and destroys.
  chaos:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:chaos
