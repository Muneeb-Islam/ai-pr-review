# Copy to .github/workflows/ai-pr-review.yml in the repository you want reviewed.
name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
  issue_comment: # Optional: enables the /ai-review command for maintainers.
    types: [created]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Never use pull_request_target here: this job must not run with secrets on fork code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./ # Sandbox: runs the Action from this repo. Consumers use owner/repo@v1.
        with:
          provider: deepseek
          pr_number: ${{ inputs.pr_number }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
