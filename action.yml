name: AI PR Review Assistant
description: Multi-agent AI review of pull requests (code review, test coverage, security).
author: ai-pr-review-assistant
branding:
  icon: search
  color: blue

inputs:
  provider:
    description: "AI provider: anthropic | openai | deepseek. Overrides the config file."
    required: false
  model:
    description: "Model ID. Overrides the config file."
    required: false
  base_url:
    description: "Optional OpenAI-compatible endpoint override. Overrides the config file."
    required: false
  mode:
    description: "Enforcement mode: comment_only | warn | fail_on_threshold. Overrides review.mode."
    required: false
  config_path:
    description: "Path to the config file, relative to the workspace."
    required: false
    default: ".github/ai-pr-review.yml"
  pr_number:
    description: "Pull request number for workflow_dispatch runs."
    required: false
  github_token:
    description: "Token used for GitHub API calls."
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.cjs
