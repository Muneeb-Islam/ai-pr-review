# yaml-language-server: $schema=../packages/shared/schemas/ai-pr-review.schema.json
# Repository-level configuration, committed to `.github/ai-pr-review.yml` and read from the
# BASE branch of each PR. It overrides the dashboard settings for the keys below.
#
# Not allowed here (dashboard only): provider, model, base_url, limits and provider credentials.
# A repo file cannot choose where code is sent or raise cost limits.

review:
  mode: comment_only # comment_only | warn | fail_on_threshold
  target_branches: [main, master]
  draft_behavior: summary_only # summary_only | full | skip
  minimum_severity: medium
  minimum_confidence: 0.8
  max_changed_files: 40
  max_patch_characters: 120000
  max_inline_comments: 20

agents:
  code_review: true
  test_coverage: true
  security: true
  final_review: false

coverage:
  artifact_name: coverage # name of the GitHub Actions artifact that holds the LCOV report
  lcov_path: lcov.info # path of the LCOV file inside that artifact

fork_prs: skip # skip | review

ignore:
  - "dist/**"
  - "coverage/**"
  - "**/*.lock"

secret_paths: # added to the built-in secret patterns
  - "**/.env*"

instructions: "" # optional extra review guidance (treated as untrusted)
